<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>احسب سعرك</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f5f7;
      color: #252525;
      font-family: Arial, Tahoma, sans-serif;
    }
    .page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 22px rgba(0,0,0,.1);
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 58px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #eee;
      background: #fff;
    }
    .back {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      color: #555; font-size: 30px;
      text-decoration: none;
    }
    .header-title {
      margin: 0; text-align: center;
      font-size: 20px; font-weight: 800;
    }
    .content { padding: 22px 18px 32px; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    .sub { margin: 0 0 22px; color: #777; font-size: 14px; }
    .product-row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }
    .product-row:last-of-type { border-bottom: 0; }
    .product-row img {
      width: 60px; height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #f0d9e1;
    }
    .prod-name { font-size: 14px; font-weight: 700; margin: 0 0 3px; }
    .prod-price { font-size: 13px; color: #e40052; font-weight: 800; }
    .qty-wrap {
      display: flex; align-items: center; gap: 8px;
    }
    .qty-btn {
      width: 30px; height: 30px;
      border: 1px solid #e40052; border-radius: 50%;
      background: #fff; color: #e40052;
      font-size: 18px; font-weight: 800;
      font-family: Arial, Tahoma, sans-serif;
      cursor: pointer; display: grid; place-items: center;
    }
    .qty-val { min-width: 20px; text-align: center; font-weight: 800; font-size: 15px; }
    .total-box {
      margin: 20px 0 14px;
      padding: 14px;
      border: 1px solid #f0d9e1;
      border-radius: 8px;
      background: #fff8fb;
    }
    .total-row {
      display: flex; justify-content: space-between;
      align-items: center; font-size: 15px;
      padding: 4px 0;
    }
    .total-row.big { font-size: 18px; font-weight: 800; margin-top: 8px; }
    .total-row.big span:last-child { color: #e40052; }
    .cta {
      display: block; width: 100%;
      padding: 15px; border: 0;
      border-radius: 8px; background: #e40052;
      color: #fff; font-size: 17px; font-weight: 800;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center; text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(228,0,82,.22);
    }
    .cta:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="back" href="index.html" aria-label="رجوع">←</a>
      <p class="header-title">احسب سعرك</p>
      <span></span>
    </header>
    <div class="content">
      <h1>اختر منتجاتك</h1>
      <p class="sub">أضف ما تريده وسنحسب الإجمالي تلقائياً</p>

      <div id="products-list">
        <div class="product-row" data-price="98">
          <img src="assets/first-page-main.webp" alt="باكج عيادة">
          <div>
            <p class="prod-name">باكج عيادة 5 في 1</p>
            <p class="prod-price">98 د.ك</p>
          </div>
          <div class="qty-wrap">
            <button class="qty-btn minus" type="button" aria-label="تقليل">−</button>
            <span class="qty-val">0</span>
            <button class="qty-btn plus" type="button" aria-label="زيادة">+</button>
          </div>
        </div>
        <div class="product-row" data-price="2">
          <img src="assets/clinic-cooling-lens.webp" alt="عدسة تبريد">
          <div>
            <p class="prod-name">عدسة تبريد داخلي</p>
            <p class="prod-price">2 د.ك</p>
          </div>
          <div class="qty-wrap">
            <button class="qty-btn minus" type="button" aria-label="تقليل">−</button>
            <span class="qty-val">0</span>
            <button class="qty-btn plus" type="button" aria-label="زيادة">+</button>
          </div>
        </div>
        <div class="product-row" data-price="30">
          <img src="assets/shopping.webp" alt="جهاز مع نظارة">
          <div>
            <p class="prod-name">جهاز إزالة الشعر + نظارة حماية</p>
            <p class="prod-price">30 د.ك</p>
          </div>
          <div class="qty-wrap">
            <button class="qty-btn minus" type="button" aria-label="تقليل">−</button>
            <span class="qty-val">0</span>
            <button class="qty-btn plus" type="button" aria-label="زيادة">+</button>
          </div>
        </div>
      </div>

      <div class="total-box">
        <div class="total-row">
          <span>المنتجات</span>
          <span id="sub-total">0 د.ك</span>
        </div>
        <div class="total-row">
          <span>توصيل</span>
          <span>مجاني</span>
        </div>
        <div class="total-row big">
          <span>الإجمالي</span>
          <span id="grand-total">0 د.ك</span>
        </div>
      </div>

      <button class="cta" id="next-btn" type="button" disabled>المتابعة للطلب</button>
    </div>
  </main>
  <script>
    const rows = document.querySelectorAll('.product-row');
    const subTotal = document.getElementById('sub-total');
    const grandTotal = document.getElementById('grand-total');
    const nextBtn = document.getElementById('next-btn');

    function calcTotal() {
      let total = 0;
      rows.forEach(function(row) {
        const qty = parseInt(row.querySelector('.qty-val').textContent, 10);
        const price = parseFloat(row.dataset.price);
        total += qty * price;
      });
      subTotal.textContent = total.toFixed(3) + ' د.ك';
      grandTotal.textContent = total.toFixed(3) + ' د.ك';
      nextBtn.disabled = total === 0;
      sessionStorage.setItem('cart_total', total.toFixed(3));
    }

    rows.forEach(function(row) {
      const minus = row.querySelector('.minus');
      const plus = row.querySelector('.plus');
      const val = row.querySelector('.qty-val');

      plus.addEventListener('click', function() {
        val.textContent = parseInt(val.textContent, 10) + 1;
        calcTotal();
      });
      minus.addEventListener('click', function() {
        const cur = parseInt(val.textContent, 10);
        if (cur > 0) { val.textContent = cur - 1; calcTotal(); }
      });
    });

    nextBtn.addEventListener('click', function() {
      window.location.href = 'step1.html';
    });
  </script>
</body>
</html>
